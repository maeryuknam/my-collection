<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Collection</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
.app{max-width:960px;margin:0 auto;padding:2rem 1rem}
h1{font-size:22px;font-weight:500;margin-bottom:4px}
.subtitle{font-size:14px;color:#888;margin-bottom:1.5rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
.stat{background:#fff;border-radius:10px;padding:0.85rem 1rem}
.stat-label{font-size:12px;color:#888;margin-bottom:4px}
.stat-value{font-size:22px;font-weight:500}
.toolbar{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap}
.toolbar input{flex:1;min-width:160px;padding:8px 12px;border:0.5px solid rgba(0,0,0,0.15);border-radius:8px;font-size:14px;background:#fff}
.toolbar select{padding:8px 10px;border:0.5px solid rgba(0,0,0,0.15);border-radius:8px;font-size:13px;background:#fff;cursor:pointer}
.btn-add{padding:8px 16px;border:none;border-radius:8px;background:#1a1a1a;color:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn-add:hover{background:#333}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;border:0.5px solid rgba(0,0,0,0.1);overflow:hidden;transition:transform 0.15s}
.card:hover{transform:translateY(-2px)}
.cover{width:100%;aspect-ratio:1;background:#f0ede8;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.cover img{width:100%;height:100%;object-fit:cover}
.cover-placeholder{font-size:40px;color:#ccc}
.badge-row{position:absolute;top:6px;left:6px;display:flex;gap:4px}
.badge{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px}
.badge-cd{background:#e8f0fe;color:#1a56b0}
.badge-lp{background:#fce8f3;color:#9d1f6e}
.badge-type{background:rgba(0,0,0,0.08);color:rgba(0,0,0,0.5);font-size:10px;padding:2px 6px;border-radius:20px}
.card-body{padding:10px 10px 8px}
.card-artist{font-size:11px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0}
.card-year{font-size:11px;color:#aaa}
.card-actions{display:flex;gap:6px;padding:0 10px 10px;justify-content:flex-end}
.btn-icon{background:none;border:none;cursor:pointer;color:#bbb;font-size:18px;padding:2px;border-radius:4px}
.btn-icon:hover{color:#1a1a1a}
.btn-icon.del:hover{color:#e24b4a}
.empty{text-align:center;padding:4rem 1rem;color:#888;grid-column:1/-1}
.loading{text-align:center;padding:3rem;color:#aaa;grid-column:1/-1}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal{background:#fff;border-radius:14px;padding:1.5rem;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:500;margin-bottom:1.25rem}
.form-row{margin-bottom:1rem}
.form-row label{display:block;font-size:12px;color:#888;margin-bottom:5px}
.form-row input,.form-row select{width:100%;padding:8px 10px;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;font-size:14px}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem}
.btn-cancel{padding:8px 16px;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;background:none;font-size:13px;cursor:pointer}
.btn-save{padding:8px 18px;border:none;border-radius:8px;background:#1a1a1a;color:#fff;font-size:13px;font-weight:500;cursor:pointer}
.btn-save:hover{background:#333}
.hidden{display:none}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:opacity 0.3s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <h1>My Collection</h1>
  <p class="subtitle">CD &amp; LP 컬렉션 관리</p>

  <div class="stats">
    <div class="stat"><div class="stat-label">전체</div><div class="stat-value" id="s-total">-</div></div>
    <div class="stat"><div class="stat-label">CD</div><div class="stat-value" id="s-cd">-</div></div>
    <div class="stat"><div class="stat-label">LP</div><div class="stat-value" id="s-lp">-</div></div>
    <div class="stat"><div class="stat-label">아티스트</div><div class="stat-value" id="s-artists">-</div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="아티스트, 앨범명 검색...">
    <select id="filter-type">
      <option value="">전체 포맷</option>
      <option value="CD">CD</option>
      <option value="LP">LP</option>
    </select>
    <select id="filter-album">
      <option value="">전체 타입</option>
      <option value="정규">정규</option>
      <option value="싱글">싱글</option>
      <option value="EP">EP</option>
      <option value="컴필레이션">컴필레이션</option>
      <option value="라이브">라이브</option>
    </select>
    <button class="btn-add" onclick="openModal()">+ 추가</button>
  </div>

  <div class="grid" id="grid"><div class="loading">불러오는 중...</div></div>
</div>

<!-- Modal -->
<div class="overlay hidden" id="overlay">
  <div class="modal">
    <h2 id="modal-title">앨범 추가</h2>
    <div class="form-2col">
      <div class="form-row">
        <label>아티스트 (원어)</label>
        <input id="f-artist" placeholder="e.g. Radiohead">
      </div>
      <div class="form-row">
        <label>아티스트 (한글)</label>
        <input id="f-artist-ko" placeholder="e.g. 라디오헤드">
      </div>
    </div>
    <div class="form-row">
      <label>앨범명</label>
      <input id="f-album" placeholder="앨범 제목">
    </div>
    <div class="form-2col">
      <div class="form-row">
        <label>발매년도</label>
        <input id="f-year" type="number" placeholder="2024" min="1900" max="2099">
      </div>
      <div class="form-row">
        <label>포맷</label>
        <select id="f-format">
          <option value="CD">CD</option>
          <option value="LP">LP</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <label>앨범 타입</label>
      <select id="f-type">
        <option value="정규">정규</option>
        <option value="싱글">싱글</option>
        <option value="EP">EP</option>
        <option value="컴필레이션">컴필레이션</option>
        <option value="라이브">라이브</option>
      </select>
    </div>
    <div class="form-row">
      <label>커버 이미지 URL (선택)</label>
      <input id="f-img" placeholder="https://...">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveAlbum()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://tixqrfugueckpvkkltlp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpeHFyZnVndWVja3B2a2tsdGxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NTAyNDMsImV4cCI6MjA5NTUyNjI0M30.1zgG4weDBqZCLd__GX-GoCtQPJBtosvlM5qFFPexVuw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let albums = [];
let editId = null;

async function loadAlbums() {
  const { data, error } = await sb.from('albums').select('*').order('created_at', { ascending: false });
  if (error) { showToast('불러오기 실패: ' + error.message); return; }
  albums = data || [];
  render();
}

function openModal(id) {
  editId = id || null;
  document.getElementById('overlay').classList.remove('hidden');
  if (id) {
    const a = albums.find(x => x.id === id);
    document.getElementById('modal-title').textContent = '앨범 수정';
    document.getElementById('f-artist').value = a.artist || '';
    document.getElementById('f-artist-ko').value = a.artist_ko || '';
    document.getElementById('f-album').value = a.album || '';
    document.getElementById('f-year').value = a.year || '';
    document.getElementById('f-format').value = a.format || 'CD';
    document.getElementById('f-type').value = a.type || '정규';
    document.getElementById('f-img').value = a.img || '';
  } else {
    document.getElementById('modal-title').textContent = '앨범 추가';
    ['f-artist','f-artist-ko','f-album','f-year','f-img'].forEach(i => document.getElementById(i).value = '');
    document.getElementById('f-format').value = 'CD';
    document.getElementById('f-type').value = '정규';
  }
}

function closeModal() { document.getElementById('overlay').classList.add('hidden'); }

async function saveAlbum() {
  const artist = document.getElementById('f-artist').value.trim();
  const album = document.getElementById('f-album').value.trim();
  if (!artist || !album) { alert('아티스트와 앨범명은 필수입니다.'); return; }
  const obj = {
    artist,
    artist_ko: document.getElementById('f-artist-ko').value.trim(),
    album,
    year: document.getElementById('f-year').value.trim(),
    format: document.getElementById('f-format').value,
    type: document.getElementById('f-type').value,
    img: document.getElementById('f-img').value.trim()
  };
  let error;
  if (editId) {
    ({ error } = await sb.from('albums').update(obj).eq('id', editId));
  } else {
    ({ error } = await sb.from('albums').insert([obj]));
  }
  if (error) { showToast('저장 실패: ' + error.message); return; }
  showToast(editId ? '수정됐습니다!' : '추가됐습니다!');
  closeModal();
  loadAlbums();
}

async function deleteAlbum(id) {
  if (!confirm('이 앨범을 삭제할까요?')) return;
  const { error } = await sb.from('albums').delete().eq('id', id);
  if (error) { showToast('삭제 실패: ' + error.message); return; }
  showToast('삭제됐습니다.');
  loadAlbums();
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const ft = document.getElementById('filter-type').value;
  const fa = document.getElementById('filter-album').value;
  return albums.filter(a => {
    const match = !q || (a.artist||'').toLowerCase().includes(q) || (a.artist_ko||'').includes(q) || (a.album||'').toLowerCase().includes(q);
    return match && (!ft || a.format === ft) && (!fa || a.type === fa);
  });
}

function render() {
  const list = getFiltered();
  document.getElementById('s-total').textContent = albums.length;
  document.getElementById('s-cd').textContent = albums.filter(a => a.format === 'CD').length;
  document.getElementById('s-lp').textContent = albums.filter(a => a.format === 'LP').length;
  document.getElementById('s-artists').textContent = new Set(albums.map(a => a.artist)).size;

  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty">${albums.length ? '검색 결과가 없습니다.' : '앨범을 추가해보세요!'}</div>`;
    return;
  }
  grid.innerHTML = list.map(a => `
    <div class="card">
      <div class="cover">
        ${a.img
          ? `<img src="${a.img}" alt="${a.album}" onerror="this.style.display='none'">`
          : `<span class="cover-placeholder">🎵</span>`}
        <div class="badge-row">
          <span class="badge ${a.format==='CD'?'badge-cd':'badge-lp'}">${a.format}</span>
          <span class="badge badge-type">${a.type}</span>
        </div>
      </div>
      <div class="card-body">
        <div class="card-artist">${a.artist_ko || a.artist}</div>
        <div class="card-title" title="${a.album}">${a.album}</div>
        <div class="card-year">${a.year || '—'}</div>
      </div>
      <div class="card-actions">
        <button class="btn-icon" onclick="openModal('${a.id}')" title="수정">✏️</button>
        <button class="btn-icon del" onclick="deleteAlbum('${a.id}')" title="삭제">🗑️</button>
      </div>
    </div>
  `).join('');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('filter-type').addEventListener('change', render);
document.getElementById('filter-album').addEventListener('change', render);
document.getElementById('overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

loadAlbums();
</script>
</body>
</html>
